[package]
name = "md2pdf-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # shipped as a binary / npm package, not on crates.io
description = "Markdown to PDF and PDF to Markdown in the browser (WebAssembly; bytes API or OPFS in a Web Worker)"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords = ["markdown", "pdf", "wasm", "webassembly", "opfs"]

[lib]
crate-type = ["cdylib"]

[dependencies]
md2pdf-core = { path = "../core" }
pdf2md-core = { path = "../pdf2md-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "DedicatedWorkerGlobalScope",
  "WorkerGlobalScope",
  "WorkerNavigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemSyncAccessHandle",
]

[lints]
workspace = true
