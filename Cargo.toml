[workspace]
resolver = "3"
members = ["core", "cli", "wasm", "pdf2md-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Markdown to PDF and PDF to Markdown conversion (Rust core, CLI, and WASM)"
homepage = "https://github.com/amwebexpert/markdown-2-pdf"
repository = "https://github.com/amwebexpert/markdown-2-pdf"
keywords = ["markdown", "pdf", "wasm", "webassembly", "opfs"]

[workspace.dependencies]
pulldown-cmark = "0.13"
thiserror = "2"
anyhow = "1"
printpdf = { version = "0.12", default-features = false }
# Same version printpdf already pulls in, without the rayon/chrono defaults (WASM-friendly).
lopdf = { version = "0.44", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints too noisy for this codebase.
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
# Selected restriction lints.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
