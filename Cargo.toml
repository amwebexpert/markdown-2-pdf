[workspace]
resolver = "3"
members = ["core", "cli", "wasm"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Markdown to PDF conversion (Rust core, CLI, and WASM)"
homepage = "https://github.com/amwebexpert/markdown-2-pdf"
repository = "https://github.com/amwebexpert/markdown-2-pdf"
keywords = ["markdown", "pdf", "wasm", "webassembly", "opfs"]

[workspace.dependencies]
pulldown-cmark = "0.13"
thiserror = "2"
anyhow = "1"
printpdf = { version = "0.12", default-features = false }
